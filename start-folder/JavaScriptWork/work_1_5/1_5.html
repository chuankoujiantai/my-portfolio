
<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電卓ページ</title>
    <link rel="stylesheet" href="1_5.css">
    <script src="1_5.js" defer></script>
</head>
<body>

    <nav>
        <a href="../../index.html">ホーム</a>
        <a href="../../work.html">課題一覧</a>
        <a href="../../contact.html">お問い合わせ</a>
        <a href="../work_1_3/1_3function.html">関数課題</a>
        <a href="../work_1_4/1_4.html">基本構文課題</a>
    </nav>

    <main>
        <h1>電卓ページ</h1>

        <div class="calculator">

            <label for="value1">値1</label>
            <input type="number" id="value1" step="any"
                   placeholder="数値を入力">

            <label for="operator">演算子</label>
            <select id="operator">
                <option value="+">＋</option>
                <option value="-">－</option>
                <option value="*">×</option>
                <option value="/">÷</option>
            </select>

            <label for="value2">値2</label>
            <input type="number" id="value2" step="any"
                   placeholder="数値を入力">

            <h2>計算結果</h2>

            <p id="result" aria-live="polite">
                両方の数値を入力してください
            </p>

        </div>
    </main>

</body>
</html>
